# =============================================================================
# Payer AI Search — LLM orchestrator (Databricks Asset Bundle)
# =============================================================================
# FastAPI backend + pre-built React SPA. An LLM orchestrator routes each question
# to Genie One (certified workspace data) or a custom MCP agent (reached outside
# Genie One). On-behalf-of-user auth so each user's Unity Catalog permissions apply.
#
# NOTE: bundle.name is DELIBERATELY DIFFERENT from the original
# "payer-finance-genie-react" bundle. That gives this branch its own DABs state,
# so deploying here creates a SEPARATE app (agent-payer-orch-dev) and never
# touches the running agent-payer-genie-ui-dev app.

bundle:
  name: payer-orchestrator

variables:
  app_name:
    description: >
      Databricks App name. Must start with "agent-" to appear in the Agents list
      and be <= 30 characters.
    default: agent-payer-orch

# The React build output (static/) is gitignored, so force-include it in the
# bundle sync — otherwise the deployed app would ship without a frontend.
# Run `npm run build` (see README) before deploying so static/ exists.
sync:
  include:
    - static/**

resources:
  apps:
    payer_orchestrator:
      name: ${var.app_name}
      description: "Payer AI Search — LLM orchestrator routing Genie One + custom MCP agents."
      source_code_path: ./
      # On-behalf-of-user: Genie, the Foundation Model, and MCP calls all run with
      # the signed-in user's permissions.
      #   - genie                    → Genie One (managed Genie MCP)
      #   - serving.serving-endpoints → the Foundation Model routing call
      #   - ai-gateway               → reach the Unity Gateway /ai-gateway/mcp-services endpoint
      #   - catalog.*                → USE/traverse + EXECUTE the connection-backed UC MCP
      #     Service securable (payer_catalog_vm.mcp.nba_payer_genie). Without these the
      #     down-scoped OBO token gets 403 Forbidden from the MCP Service (ai-gateway alone
      #     authorizes the endpoint, not the underlying UC connection securable).
      user_api_scopes:
        - genie
        - serving.serving-endpoints
        - ai-gateway
        - catalog.connections
        - catalog.catalogs
        - catalog.schemas
      config:
        command:
          - python
          - app.py
        env:
          # Certified Genie agents shown in the rail + matched to Genie One's
          # routing (Genie One does the real routing across the workspace).
          - name: GENIE_SPACE_AGENTS_FILE
            value: agents.demo.json
          # Custom MCP agents reached OUTSIDE Genie One — the orchestrator exposes
          # each as a tool the router LLM can pick, and calls it over its /mcp URL.
          - name: EXTERNAL_MCP_AGENTS_FILE
            value: external_mcp.demo.json
          # Foundation Model that does the routing (tool selection).
          - name: ORCHESTRATOR_MODEL
            value: databricks-claude-sonnet-4-6

targets:
  dev:
    mode: development
    default: true
    variables:
      app_name: agent-payer-orch-dev

  prod:
    mode: production
    variables:
      app_name: agent-payer-orch
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
